et because the play would begin soon. Her friend Daniel found some tape and helped her straighten it. Together, they fixed the crown before the music began. Nora thanked Daniel and smiled as the curtain opened.","q":"What caused Nora to feel upset?","opts":["The music was too loud","Her crown was damaged","Daniel went home"],"a":1,"why":"Find the event that made the problem happen."},{"section":"Reading","passage":"The Missing Costume\nNora brought a paper crown for the class play. When she opened her bag, it was bent. She felt upset because the play would begin soon. Her friend Daniel found some tape and helped her straighten it. Together, they fixed the crown before the music began. Nora thanked Daniel and smiled as the curtain opened.","q":"What is the best message of this story?","opts":["Working with a friend can solve a problem","Everyone should wear a crown","Plays should begin late"],"a":0,"why":"A theme is a message that reaches beyond one story event."},{"section":"Reading","passage":"The Missing Costume\nNora brought a paper crown for the class play. When she opened her bag, it was bent. She felt upset because the play would begin soon. Her friend Daniel found some tape and helped her straighten it. Together, they fixed the crown before the music began. Nora thanked Daniel and smiled as the curtain opened.","q":"What happened immediately before the curtain opened?","opts":["Nora thanked Daniel","Nora first packed her crown","The crown became bent"],"a":0,"why":"Use the order of events in the final two sentences."},{"section":"Word Work","q":"Choose the correct sentence: This bridge is ___ than that bridge.","opts":["long","longer","longest"],"a":1,"why":"Use -er to compare two things."},{"section":"Word Work","q":"Choose the correct sentence: That was the ___ puzzle in the set.","opts":["hard","harder","hardest"],"a":2,"why":"Use -est when comparing one with a whole group."},{"section":"Word Work","q":"Which word has the same vowel sound as the “ow” in “brown”?","opts":["town","snow","show"],"a":0,"why":"Brown and town rhyme in their vowel sound."},{"section":"Word Work","q":"Which word has the same vowel sound as “bird”?","opts":["third","beard","board"],"a":0,"why":"Bird and third share the /er/ vowel sound."},{"section":"Word Work","q":"What is the plural of “dish”?","opts":["dishs","dishes","dishies"],"a":1,"why":"Add -es to most nouns ending in sh."},{"section":"Word Work","q":"Which word shows an action completed yesterday?","opts":["climbs","climbed","will climb"],"a":1,"why":"The -ed form usually tells about a past action."},{"section":"Language Skills","q":"Choose the verb for an action happening now.","opts":["is drawing","drew","will draw"],"a":0,"why":"Is + verb-ing can show an action in progress now."},{"section":"Language Skills","q":"Choose the sentence about the future.","opts":["They planted seeds.","They plant seeds.","They will plant seeds."],"a":2,"why":"Will + base verb points to a future action."},{"section":"Language Skills","q":"Which sentence is correct?","opts":["The team are plays.","The team is playing.","The team am playing."],"a":1,"why":"The singular subject team uses is here."},{"section":"Language Skills","q":"Choose the correct past-tense sentence.","opts":["Last night, I watched the stars.","Last night, I watch the stars.","Last night, I will watch the stars."],"a":0,"why":"Last night signals the past, so watched is appropriate."},{"section":"Language Skills","q":"Choose the correct form: There are ___ marbles in this jar than in that one.","opts":["few","fewer","fewest"],"a":1,"why":"Fewer compares amounts of countable things."},{"section":"Language Skills","q":"Which sentence agrees with its subject?","opts":["My parents is cooking.","My parents am cooking.","My parents are cooking."],"a":2,"why":"Plural parents takes are."},{"section":"Reading","q":"Two articles describe different ways people save water. What question helps you compare them?","opts":["What do both articles tell us about saving water?","Which article has more letters?","Which article has the longest title?"],"a":0,"why":"Compare their ideas, not their lengths."},{"section":"Reading","q":"A character lends a classmate her notes when he misses school. Which theme fits best?","opts":["Kindness helps others","School days are too long","Notes are always blue"],"a":0,"why":"A theme is a message you can learn from what characters do."},{"section":"Reading","q":"A child forgets to water a plant. Its leaves droop. What is the cause?","opts":["The plant has leaves","The child forgot to water it","The leaves are green"],"a":1,"why":"The cause explains why something happened."},{"section":"Word Work","q":"Which word has the same vowel sound as “bird”?","opts":["shirt","bread","boat"],"a":0,"why":"Bird and shirt use the same /er/ vowel sound."},{"section":"Word Work","q":"Choose the correct plural: The farmer has two ___.","opts":["brushs","brushes","brushies"],"a":1,"why":"For nouns ending in sh, add -es."},{"section":"Word Work","q":"Choose the correct form: This trail is ___ than the other one.","opts":["long","longer","longest"],"a":1,"why":"Use -er when comparing two things."},{"section":"Language Skills","q":"Which sentence describes something happening right now?","opts":["I am drawing a map.","I drew a map yesterday.","I will draw a map tomorrow."],"a":0,"why":"Am drawing describes a present action."},{"section":"Language Skills","q":"Choose the correct past tense: We ___ the classroom after art.","opts":["clean","cleaned","will clean"],"a":1,"why":"Cleaned is the past-tense form."},{"section":"Language Skills","q":"Which sentence uses the superlative correctly?","opts":["Mina is taller than Sun.","Mina is the tallest on her team.","Mina is tall than Sun."],"a":1,"why":"The tallest compares one person with the whole group."},{"section":"Practice Exam","q":"What do both texts describe?","opts":["Planting flowers in pots","Making places safer for people","Buying school lunches"],"a":1,"why":"Both groups work to make shared spaces safer.","passage":"Text A: The School Bike Rack\nA class noticed that bicycles were scattered near the gate. They asked the principal for a safer place to park them. The school installed a bike rack, and students made signs to show where bikes should go. Now the entrance stays clear.\n\nText B: The Neighborhood Walking Path\nPeople in a neighborhood wanted a safer walk to the library. Volunteers trimmed branches that blocked the path. The town added bright crossing signs. Now families can walk along the route more comfortably."},{"section":"Practice Exam","q":"Which change happened only in Text A?","opts":["Branches were trimmed","A crossing sign was added","A bike rack was installed"],"a":2,"why":"The bike rack appears only in Text A.","passage":"Text A: The School Bike Rack\nA class noticed that bicycles were scattered near the gate. They asked the principal for a safer place to park them. The school installed a bike rack, and students made signs to show where bikes should go. Now the entrance stays clear.\n\nText B: The Neighborhood Walking Path\nPeople in a neighborhood wanted a safer walk to the library. Volunteers trimmed branches that blocked the path. The town added bright crossing signs. Now families can walk along the route more comfortably."},{"section":"Practice Exam","q":"Why did the volunteers trim branches?","opts":["The branches blocked a path","The branches were made of metal","The path was a playground"],"a":0,"why":"Look for the reason the branches needed cutting.","passage":"Text A: The School Bike Rack\nA class noticed that bicycles were scattered near the gate. They asked the principal for a safer place to park them. The school installed a bike rack, and students made signs to show where bikes should go. Now the entrance stays clear.\n\nText B: The Neighborhood Walking Path\nPeople in a neighborhood wanted a safer walk to the library. Volunteers trimmed branches that blocked the path. The town added bright crossing signs. Now families can walk along the route more comfortably."},{"section":"Practice Exam","q":"How are the solutions different?","opts":["Both involve buying new bicycles","One organizes bicycles; the other improves a walking route","Both replace classrooms"],"a":1,"why":"Compare the specific problems and solutions.","passage":"Text A: The School Bike Rack\nA class noticed that bicycles were scattered near the gate. They asked the principal for a safer place to park them. The school installed a bike rack, and students made signs to show where bikes should go. Now the entrance stays clear.\n\nText B: The Neighborhood Walking Path\nPeople in a neighborhood wanted a safer walk to the library. Volunteers trimmed branches that blocked the path. The town added bright crossing signs. Now families can walk along the route more comfortably."},{"section":"Practice Exam","q":"What conclusion fits both texts?","opts":["Only adults can solve problems","Signs never help anyone","Small changes can make public places work better"],"a":2,"why":"Both texts show practical improvements.","passage":"Text A: The School Bike Rack\nA class noticed that bicycles were scattered near the gate. They asked the principal for a safer place to park them. The school installed a bike rack, and students made signs to show where bikes should go. Now the entrance stays clear.\n\nText B: The Neighborhood Walking Path\nPeople in a neighborhood wanted a safer walk to the library. Volunteers trimmed branches that blocked the path. The town added bright crossing signs. Now families can walk along the route more comfortably."},{"section":"Practice Exam","q":"What problem begins the story?","opts":["The picnic has to move indoors","The fruit is missing","The teacher has lost the classroom"],"a":0,"why":"Identify the challenge the students face.","passage":"The Inventive Lunch Team\nWhen the school picnic was moved indoors, the students felt disappointed. Kai suggested making a picnic area inside the classroom. Noor spread clean mats on the floor. Ben arranged fruit and sandwiches on small trays. Before lunch, they helped another class set up too. Their teacher smiled at the busy team. By midday, the room felt cheerful, and everyone had a place to sit."},{"section":"Practice Exam","q":"What happens after Noor spreads the mats?","opts":["The teacher cancels lunch","Ben sets out food","Kai leaves the school"],"a":1,"why":"Follow the order of the actions.","passage":"The Inventive Lunch Team\nWhen the school picnic was moved indoors, the students felt disappointed. Kai suggested making a picnic area inside the classroom. Noor spread clean mats on the floor. Ben arranged fruit and sandwiches on small trays. Before lunch, they helped another class set up too. Their teacher smiled at the busy team. By midday, the room felt cheerful, and everyone had a place to sit."},{"section":"Practice Exam","q":"How do the students solve their problem?","opts":["They wait until next week","They take a bus to the park","They make an indoor picnic area"],"a":2,"why":"The team creates a different place to eat.","passage":"The Inventive Lunch Team\nWhen the school picnic was moved indoors, the students felt disappointed. Kai suggested making a picnic area inside the classroom. Noor spread clean mats on the floor. Ben arranged fruit and sandwiches on small trays. Before lunch, they helped another class set up too. Their teacher smiled at the busy team. By midday, the room felt cheerful, and everyone had a place to sit."},{"section":"Practice Exam","q":"Which theme fits the story?","opts":["Teamwork can turn a setback into something good","Food is always better outdoors","Picnics should never change"],"a":0,"why":"The characters cooperate when plans change.","passage":"The Inventive Lunch Team\nWhen the school picnic was moved indoors, the students felt disappointed. Kai suggested making a picnic area inside the classroom. Noor spread clean mats on the floor. Ben arranged fruit and sandwiches on small trays. Before lunch, they helped another class set up too. Their teacher smiled at the busy team. By midday, the room felt cheerful, and everyone had a place to sit."},{"section":"Practice Exam","q":"Why does the classroom feel cheerful?","opts":["The students are sent home","Everyone helps prepare for lunch","The windows are broken"],"a":1,"why":"Use the final part of the passage to infer the cause.","passage":"The Inventive Lunch Team\nWhen the school picnic was moved indoors, the students felt disappointed. Kai suggested making a picnic area inside the classroom. Noor spread clean mats on the floor. Ben arranged fruit and sandwiches on small trays. Before lunch, they helped another class set up too. Their teacher smiled at the busy team. By midday, the room felt cheerful, and everyone had a place to sit."},{"section":"Practice Exam","q":"There is ___ room on this bus than on the last one.","opts":["most","many","more"],"a":2,"why":"More compares quantities between two buses."},{"section":"Practice Exam","q":"We may visit the museum ___.","opts":["tomorrow","purple","quick"],"a":0,"why":"Tomorrow is a time word that makes sense."},{"section":"Practice Exam","q":"I know ___ to solve this puzzle.","opts":["fast","how","well"],"a":1,"why":"How means in what way."},{"section":"Practice Exam","q":"The teacher gave us ___ a pencil.","opts":["early","near","each"],"a":2,"why":"Each means every one of us individually."},{"section":"Practice Exam","q":"The rabbit ran ___ the tunnel.","opts":["through","careful","sudden"],"a":0,"why":"Through shows movement from one side to the other."},{"section":"Practice Exam","q":"We can try the game ___.","opts":["circle","again","therefore"],"a":1,"why":"Again means one more time."},{"section":"Practice Exam","q":"The truck arrived ___ than expected.","opts":["early","earliest","earlier"],"a":2,"why":"Earlier compares two times."},{"section":"Practice Exam","q":"I have ___ finished my homework.","opts":["already","across","almostly"],"a":0,"why":"Already fits with have finished."},{"section":"Practice Exam","q":"Choose the correct sentence.","opts":["The children is ready yesterday.","The children were ready.","The children was ready."],"a":1,"why":"Plural children takes were in the past."},{"section":"Practice Exam","q":"Which form compares three runners?","opts":["faster","fast","fastest"],"a":2,"why":"Fastest compares one with a group of three or more."},{"section":"Practice Exam","q":"Which word has the same vowel sound as “star”?","opts":["car","care","cat"],"a":0,"why":"Star and car share the long ar sound."},{"section":"Practice Exam","q":"Which word has the same vowel sound as “cloud”?","opts":["food","house","snow"],"a":1,"why":"Cloud and house share the /ow/ sound."},{"section":"Practice Exam","q":"Choose the correct plural of “box”.","opts":["boxs","boxies","boxes"],"a":2,"why":"Add -es to nouns ending in x."},{"section":"Practice Exam","q":"What is the past tense of “jump”?","opts":["jumped","jumping","jumps"],"a":0,"why":"Add -ed for this regular past-tense verb."},{"section":"Practice Exam","q":"Choose the past-tense sentence.","opts":["We will visit the aquarium.","We visited the aquarium.","We visit the aquarium every year."],"a":1,"why":"Visited describes an action already finished."},{"section":"Practice Exam","q":"Which sentence describes the future?","opts":["The class sang yesterday.","The class sings today.","The class will sing on Friday."],"a":2,"why":"Will sing tells what is going to happen."},{"section":"Practice Exam","q":"Which sentence describes an action happening now?","opts":["Ava is building a tower.","Ava built a tower.","Ava will build a tower."],"a":0,"why":"Is building is present progressive."},{"section":"Practice Exam","q":"Which sentence is correct?","opts":["My friends am waiting outside.","My friends are waiting outside.","My friends is waiting outside."],"a":1,"why":"Plural friends uses are."},{"section":"Practice Exam","q":"Choose the correct comparison.","opts":["This bag is heaviest than mine.","This bag is heavy than mine.","This bag is heavier than mine."],"a":2,"why":"Heavier is the comparative form of heavy."},{"section":"Practice Exam","q":"Which sentence is correct?","opts":["The baby slept peacefully.","The baby sleeped peacefully.","The baby sleeping peacefully yesterday."],"a":0,"why":"Slept is the irregular past tense of sleep."}];
const sections=['Reading','Word Work','Language Skills','Practice Exam'];
let section='Reading',index=0,score=0,answered=false;
const progress={};let practiceAnswers=Array(30).fill(null),practiceIndex=0,practiceComplete=false;
const $=x=>document.querySelector(x);
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function chooseSection(s){section=s;if(s==='Practice Exam'){renderPractice();return;}index=progress[s]?.index||0;score=progress[s]?.score||0;answered=false;renderGuided();}
function renderGuided(){const list=DATA.filter(q=>q.section===section);document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.section===section)));const host=$('#work');
if(index>=list.length){host.innerHTML=`<div class="summary"><h2>Great work!</h2><p>You completed ${safe(section)}. You answered ${score} of ${list.length} correctly on the first try.</p><p>Read the explanations and try again to strengthen your skills.</p><button class="next" id="restart" type="button">Practice again</button></div>`;$('#restart').onclick=()=>{progress[section]={index:0,score:0};index=0;score=0;renderGuided()};return;}
const q=list[index];host.innerHTML=`<div class="progress">${safe(section)} · Question ${index+1} of ${list.length}</div><div class="bar" aria-hidden="true"><span style="width:${index/list.length*100}%"></span></div>${q.passage?`<div class="passage">${safe(q.passage)}</div>`:''}<div class="question">${safe(q.q)}</div><div class="choices">${q.opts.map((op,i)=>`<button class="choice" data-choice="${i}" type="button">${'ABC'[i]}. ${safe(op)}</button>`).join('')}</div><div id="feedback" aria-live="polite"></div><button class="next" id="next" type="button" hidden>${index===list.length-1?'Finish section':'Next question'}</button>`;
host.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;let n=Number(b.dataset.choice);if(n===q.a)score++;host.querySelectorAll('[data-choice]').forEach(c=>{const v=Number(c.dataset.choice);c.disabled=true;if(v===q.a)c.classList.add('correct');else if(v===n)c.classList.add('wrong');});$('#feedback').innerHTML=`<div class="feedback">${n===q.a?'✓ Well done!':'Not quite. The green choice is correct.'} ${safe(q.why)}</div>`;$('#next').hidden=false;progress[section]={index,score};});
$('#next').onclick=()=>{index++;answered=false;progress[section]={index,score};renderGuided();};}
function renderPractice(){document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.section==='Practice Exam')));const host=$('#work');const list=DATA.filter(q=>q.section==='Practice Exam');if(practiceComplete){const correct=list.reduce((s,q,i)=>s+Number(practiceAnswers[i]===q.a),0);host.innerHTML=`<div class="summary"><h2>Your Practice Exam results</h2><p class="question">${correct} / ${list.length} correct</p><p>This is original practice, not your school exam. Read the explanations below to learn from every answer.</p><button class="next" id="practiceAgain" type="button">Try a new attempt</button></div><div class="review-list">${list.map((q,i)=>`<div class="review-item"><strong>${i+1}. ${safe(q.q)}</strong><p>Your answer: ${practiceAnswers[i]===null?'Not answered':safe('ABC'[practiceAnswers[i]]+'. '+q.opts[practiceAnswers[i]])}</p><p class="${practiceAnswers[i]===q.a?'good':'needs-review'}">Correct: ${safe('ABC'[q.a]+'. '+q.opts[q.a])}</p><p>${safe(q.why)}</p></div>`).join('')}</div>`;$('#practiceAgain').onclick=()=>{practiceAnswers=Array(list.length).fill(null);practiceIndex=0;practiceComplete=false;renderPractice()};return;}
const q=list[practiceIndex];const completed=practiceAnswers.filter(a=>a!==null).length;
host.innerHTML=`<p class="practice-note"><strong>Independent practice:</strong> There is no feedback until you finish. The passages and questions are completely new.</p><div class="progress">Practice Exam · Question ${practiceIndex+1} of ${list.length} · ${completed} answered</div><div class="bar" aria-hidden="true"><span style="width:${completed/list.length*100}%"></span></div>${q.passage?`<div class="passage">${safe(q.passage)}</div>`:''}<div class="question">${safe(q.q)}</div><div class="choices">${q.opts.map((op,i)=>`<button type="button" class="choice ${practiceAnswers[practiceIndex]===i?'selected':''}" aria-pressed="${practiceAnswers[practiceIndex]===i}" data-choice="${i}">${'ABC'[i]}. ${safe(op)}</button>`).join('')}</div><div class="practice-nav"><button type="button" class="next secondary" id="previous" ${practiceIndex===0?'disabled':''}>Previous</button><button type="button" class="next" id="forward">${practiceIndex===list.length-1?'Review answers':'Next question'}</button></div><p class="fine" id="practiceTip" aria-live="polite">You can move between questions and change your answers before submitting.</p>`;
host.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{practiceAnswers[practiceIndex]=Number(b.dataset.choice);renderPractice();});$('#previous').onclick=()=>{practiceIndex--;renderPractice()};$('#forward').onclick=()=>{if(practiceIndex<list.length-1){practiceIndex++;renderPractice();}else{renderSubmit();}};}
function renderSubmit(){const host=$('#work');const list=DATA.filter(q=>q.section==='Practice Exam');const missing=practiceAnswers.map((v,i)=>v===null?i+1:null).filter(Boolean);host.innerHTML=`<div class="summary"><h2>Ready to finish?</h2><p>You answered ${list.length-missing.length} of ${list.length} questions.</p>${missing.length?`<p>Unanswered question numbers: ${missing.join(', ')}</p>`:''}<p>Once you submit, you'll see the results and explanations.</p><div class="practice-nav"><button type="button" class="next secondary" id="goBack">Return to questions</button><button type="button" class="next" id="submitPractice">Submit answers</button></div></div>`;$('#goBack').onclick=()=>renderPractice();$('#submitPractice').onclick=()=>{practiceComplete=true;renderPractice();};}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>chooseSection(b.dataset.section));renderGuided();
</script><script>window.PREP_ORIGINAL_DATA=DATA;</script><script src="chichi-celebrations.js"></script><script src="study-enhancements.js?v=1.08"></script></body></html>
