<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fffaf0">
  <title>Chichi's English Town · G2 Lions · myView 1.4 Unit 4</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <button id="globalHome" class="globalHome" aria-label="Home"><img src="assets/chichi_title_logo.png" alt="Chichi's English Town"></button>

  <main id="app">
    <section id="homeScreen" class="screen active homeScreen" aria-label="Chichi's English Town home">
      <div class="homeCanvas">
        <img class="homeArt homeArtLandscape" src="assets/home_g2_landscape.png" alt="Chichi reading in the village square">
        <img class="homeArt homeArtPortrait" src="assets/home_g2_portrait.png" alt="Chichi reading in the village square">
        <button id="homeChichi" class="sceneHotspot chichiHotspot" aria-label="Choose a week"></button>
        <button id="homeOnboardingBadge" class="homeOnboardingBadge" type="button" tabindex="-1" aria-label="Click here to choose a week" hidden><img src="assets/click_here_sticker_arrow.png" alt="Click here!"></button>
        <button id="homeRobin" class="sceneHotspot robinHotspot" aria-label="Play robin birdsong"></button>
        <button id="homeBell" class="sceneHotspot bellHotspot" aria-label="Ring the church bell"></button>
      </div>
    </section>

    <section id="weeksScreen" class="screen weeksScreen" aria-label="Choose a week">
      <div class="weeksGrid" id="weeksGrid"></div>
    </section>

    <section id="hubScreen" class="screen hubScreen" aria-label="Week learning hub">
      <div id="hubContent" class="hubContent"></div>
    </section>

    <section id="activityScreen" class="screen activityScreen" aria-label="Learning activity">
      <div id="activityContent" class="activityContent"></div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
